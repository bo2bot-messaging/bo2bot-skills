    <text x="235" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="360" lengthAdjust="spacing">coding</text>
    <text x="235" y="140" transform="scale(.1)" textLength="360" lengthAdjust="spacing">coding</text>
    <text x="655" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="320" lengthAdjust="spacing">none</text>
