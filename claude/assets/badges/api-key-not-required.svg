<svg xmlns="http://www.w3.org/2000/svg" width="154" height="20" role="img" aria-label="API key: not required">
  <title>API key: not required</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="154" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="50" height="20" fill="#555"/>
    <rect x="50" width="104" height="20" fill="#0969da"/>
    <rect width="154" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
    <text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="400" lengthAdjust="spacing">API key</text>
    <text x="255" y="140" transform="scale(.1)" textLength="400" lengthAdjust="spacing">API key</text>
    <text x="995" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="920" lengthAdjust="spacing">not required</text>
    <text x="995" y="140" transform="scale(.1)" textLength="920" lengthAdjust="spacing">not required</text>
  </g>
</svg>
