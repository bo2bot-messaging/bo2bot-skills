<svg xmlns="http://www.w3.org/2000/svg" width="138" height="20" role="img" aria-label="setup: ~10 minutes">
  <title>setup: ~10 minutes</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="138" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="40" height="20" fill="#555"/>
    <rect x="40" width="98" height="20" fill="#2ea44f"/>
    <rect width="138" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
    <text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="300" lengthAdjust="spacing">setup</text>
    <text x="205" y="140" transform="scale(.1)" textLength="300" lengthAdjust="spacing">setup</text>
    <text x="875" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="870" lengthAdjust="spacing">~10 minutes</text>
    <text x="875" y="140" transform="scale(.1)" textLength="870" lengthAdjust="spacing">~10 minutes</text>
  </g>
</svg>
